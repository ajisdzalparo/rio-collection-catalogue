services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-ajisdzalparo/rio-collection-catalogue}:latest
    container_name: rio_collection_app
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.production
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - JWT_SECRET=${JWT_SECRET}
      - RAJAONGKIR_API_KEY=${RAJAONGKIR_API_KEY}
      - RAJAONGKIR_ACCOUNT_TYPE=${RAJAONGKIR_ACCOUNT_TYPE}
      - RAJAONGKIR_ORIGIN_CITY_ID=${RAJAONGKIR_ORIGIN_CITY_ID}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - NEXT_PUBLIC_MINIO_PUBLIC_URL=${NEXT_PUBLIC_MINIO_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
