services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-ajisdzalparo/rio-collection-catalogue}:latest
    container_name: rio_collection_app
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
