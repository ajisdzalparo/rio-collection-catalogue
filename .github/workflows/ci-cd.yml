name: CI/CD Pipeline & Docker Publish

on:
  push:
    branches:
      - production
      - main
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - production
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Continuous Integration: Lint, Typecheck, and Build Validation
  # ============================================================================
  ci:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun x prisma generate

      - name: Lint Code
        run: bun run lint

      - name: Typecheck TypeScript
        run: bun run typecheck

      - name: Build Next.js Application
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/rio_collection?schema=public"

  # ============================================================================
  # 2. Continuous Delivery: Build and Push Docker Image to GHCR
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (optional multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api

  # ============================================================================
  # 3. Trigger Dokploy Auto-Deployment via Tailscale VPN
  # ============================================================================
  trigger-deploy:
    name: Trigger Dokploy Deployment
    needs: docker-build-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/production' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Trigger Dokploy Webhook
        run: |
          echo "Sending deployment trigger to Dokploy via Tailscale..."
          if [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL secret is not configured!"
            exit 1
          fi
          
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}")
          echo "Dokploy Webhook Response HTTP Status: $response"
          
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "Successfully triggered Dokploy auto-deployment!"
          else
            echo "::error::Failed to trigger Dokploy deployment. Response code: $response"
            exit 1
          fi

